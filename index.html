<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Planner · Entrar</title>
<style>
:root{--bg:#F7F3EC;--card:#FFFFFF;--txt:#1D2A3A;--mut:#6B7A8C;--line:#E4DED3;--dusk:#355070;--bronze:#B07A45;--err:#B3261E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1520;--card:#162030;--txt:#EDE8DF;--mut:#8D9AAC;--line:#25344A;--dusk:#6F8FB8;--bronze:#C89A62;--err:#F2857C}}
:root[data-theme="dark"]{--bg:#0E1520;--card:#162030;--txt:#EDE8DF;--mut:#8D9AAC;--line:#25344A;--dusk:#6F8FB8;--bronze:#C89A62;--err:#F2857C}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 26px;box-shadow:0 18px 40px rgba(0,0,0,.12)}
.mark{width:44px;height:44px;border-radius:14px;background:var(--dusk);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 22px;color:var(--mut);font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);outline:none}
input:focus{border-color:var(--dusk);box-shadow:0 0 0 3px rgba(53,80,112,.18)}
button{width:100%;margin-top:14px;font:inherit;font-weight:600;padding:13px;border:0;border-radius:12px;background:var(--dusk);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.keep{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:14px;color:var(--txt);cursor:pointer}
.keep input{width:18px;height:18px;margin:0;accent-color:var(--dusk)}
.err{min-height:20px;margin-top:12px;color:var(--err);font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
</style>
</head>
<body>
<main class="box" id="box">
  <div class="mark">P</div>
  <h1>Olá, Mauro</h1>
  <p class="sub">Digite sua senha para abrir o Planner.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Senha</label>
    <input id="pw" type="password" required autofocus />
    <label class="keep"><input type="checkbox" id="keep" checked> Manter conectado neste aparelho</label>
    <button id="go" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<script>
(function(){
  var AUTH = 'planner-auth';
  var vault = JSON.parse(document.getElementById('vault').textContent);
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var hx = function(u){ return Array.from(u, function(x){ return x.toString(16).padStart(2,'0'); }).join(''); };
  var unhx = function(h){ return Uint8Array.from(h.match(/../g), function(x){ return parseInt(x,16); }); };
  var f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go'), box = document.getElementById('box'), keep = document.getElementById('keep');

  async function bits(pass, salt, n){
    var k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:vault.iter, hash:'SHA-256'}, k, n));
  }
  async function open(vaultKey, syncBits){
    var key = await crypto.subtle.importKey('raw', vaultKey, {name:'AES-GCM'}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(vault.iv)}, key, b64(vault.ct));
    var html = new TextDecoder().decode(pt);
    var inj = '<script>window.__SYNC={token:"' + hx(syncBits.slice(0,32)) + '",key:"' + hx(syncBits.slice(32)) + '"};' +
      'window.__reload=function(){parent.location.reload()};window.__logout=function(){try{parent.localStorage.removeItem("' + AUTH + '")}catch(e){};parent.location.reload()};<\/script>';
    html = html.replace(/<head>/i, function(m){ return m + inj; });
    /* O app abre num quadro da tela inteira: os estilos da tela de login não entram nele */
    var f = document.createElement('iframe');
    f.setAttribute('title', 'Planner');
    f.allow = 'clipboard-read; clipboard-write; fullscreen; wake-lock; autoplay';
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;display:block';
    f.srcdoc = html;
    document.body.setAttribute('style', 'margin:0;padding:0;display:block;min-height:0;background:#0E1520');
    document.body.innerHTML = '';
    document.body.appendChild(f);
  }
  /* Entrada automática: chaves guardadas neste aparelho */
  try{
    var saved = JSON.parse(localStorage.getItem(AUTH) || 'null');
    if(saved && saved.vs === vault.salt && saved.vk && saved.sb){
      box.style.visibility = 'hidden';
      open(unhx(saved.vk), unhx(saved.sb)).catch(function(){ try{ localStorage.removeItem(AUTH); }catch(e){} box.style.visibility = ''; });
    }
  }catch(e){}

  f.addEventListener('submit', async function(e){
    e.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = 'Abrindo…';
    try{
      var vk = await bits(pw.value, b64(vault.salt), 256);
      var sb = await bits(pw.value, new TextEncoder().encode('planner-sync-v1'), 512);
      if(keep.checked){ try{ localStorage.setItem(AUTH, JSON.stringify({vs:vault.salt, vk:hx(vk), sb:hx(sb)})); }catch(x){} }
      else { try{ localStorage.removeItem(AUTH); }catch(x){} }
      await open(vk, sb);
    }catch(x){
      try{ localStorage.removeItem(AUTH); }catch(y){}
      go.disabled = false; go.textContent = 'Entrar';
      err.textContent = 'Senha incorreta. Tente de novo.';
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      pw.select();
    }
  });
})();
</script>
